#baseURL = "https://jmsdnns.com/"
baseURL = "/"
locale = "en-us"
title = "JmsDnns"

audioFiles = "https://www.dropbox.com/scl/fi/0akdjky97iqzl8uojkug9/audio.zip?rlkey=hnnl8wnocvnpurrcs0ckt61mh&dl=1"

disableKinds = ["sitemap"]

[taxonomies]
# disabled - using sections for series instead
# series = "series"
[outputs]
section = ['html', 'rss']

[pagination]
pagerSize = 5

# markdown config settings https://gohugo.io/getting-started/configuration-markup/#goldmark
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
hardWraps = false
unsafe = true
xhtml = false
[markup.highlight]
codeFences = true
noClasses = false
